<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Wish 💙</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1b2735);
background-size:400% 400%;
animation:bg 12s ease infinite;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:90%;
max-width:550px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(12px);
padding:35px;
border-radius:20px;
text-align:center;
color:white;
box-shadow:0 10px 40px rgba(0,0,0,.4);
}

h1{
font-size:40px;
margin-bottom:15px;
}

p{
font-size:18px;
line-height:1.7;
margin-bottom:25px;
}

button{
padding:14px 30px;
font-size:17px;
border:none;
border-radius:50px;
cursor:pointer;
background:#00c6ff;
color:white;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

#message{
margin-top:25px;
font-size:22px;
font-weight:bold;
color:#FFD54F;
min-height:60px;
}

.heart{
position:absolute;
color:#ff4d6d;
font-size:20px;
animation:fall 6s linear infinite;
opacity:.8;
}

@keyframes fall{
0%{
transform:translateY(-100vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(100vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card">
<h1>Hey Mahin 💙</h1>

<p>
Some people make life brighter just by being in it.<br><br>
May your days always be filled with happiness,
success and beautiful memories.
</p>

<button onclick="showWish()">Open My Surprise 🎁</button>

<div id="message"></div>

</div>

<script>

function showWish(){

let text="🎉 Happy Birthday, Mahin! 💙<br><br>You deserve every happiness in this world. Keep smiling always. 🌸<br><br>— With love, Mou ❤️";

document.getElementById("message").innerHTML=text;

for(let i=0;i<35;i++){

let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(15+Math.random()*30)+"px";
heart.style.animationDuration=(3+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},7000);

}

}

</script>

</body>
</html>
